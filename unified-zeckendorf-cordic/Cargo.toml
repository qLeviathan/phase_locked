[workspace]
members = [
    "core",
    "python-bindings",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Leviathan AI Systems"]
license = "MIT"
repository = "https://github.com/qLeviathan/phase_locked"

[workspace.dependencies]
# Integer-only fixed-point arithmetic
fixed = "1.24"
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Error handling
thiserror = "1.0"
# Python bindings
pyo3 = { version = "0.20", features = ["extension-module"] }
